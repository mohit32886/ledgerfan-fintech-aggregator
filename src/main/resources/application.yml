server:
  port: 8080

spring:
  application:
    name: ledgerfan-fintech-aggregator
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:ledgerfandb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

ledgerfan:
  aggregator:
    global-deadline-ms: 85
    per-upstream-timeout-ms: 60
    cache-ttl-seconds: 30
    stale-ttl-seconds: 300
  cache:
    redis-enabled: false
  outbox:
    batch-size: 100
    poll-interval-ms: 500
    topic: ledger.domain.events.v1
    kafka-enabled: false
  observability:
    otlp-enabled: false
    otlp-endpoint: http://localhost:4318/v1/traces
    max-retained-traces: 200
